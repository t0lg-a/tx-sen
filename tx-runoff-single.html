html,
body {

.right-col::before,

.right-col::before {
  top: 0;

.right-col::after {

    <script>
const {
  useState,
  useMemo,
  useEffect,
  useRef
} = React;

/* ──────────── ARCGIS ──────────── */
// Public ArcGIS Online Human Geography vector tile resources.
// All three styles point at the same underlying service (World_Basemap_v2);
// the items just supply different style.json files (which source-layers to
// render and how). No API key needed for public items.
const ARCGIS_TILE_URL    = "https://basemaps.arcgis.com/arcgis/rest/services/World_Basemap_v2/VectorTileServer/tile/{z}/{y}/{x}.pbf";
const ARCGIS_GLYPHS_URL  = "https://basemaps.arcgis.com/arcgis/rest/services/World_Basemap_v2/VectorTileServer/resources/fonts/{fontstack}/{range}.pbf";
const ARCGIS_HG_BASE_STYLE   = "https://www.arcgis.com/sharing/rest/content/items/2afe5b807fa74006be6363fd243ffb30/resources/styles/root.json";
const ARCGIS_HG_DETAIL_STYLE = "https://www.arcgis.com/sharing/rest/content/items/97fa1365da1e43eabb90d0364326bc2d/resources/styles/root.json";
const ARCGIS_HG_LABEL_STYLE  = "https://www.arcgis.com/sharing/rest/content/items/ba52238d338745b1a355407ec9df6768/resources/styles/root.json";

/* ──────────── MARGIN COLOR RAMPS ────────────
   20 steps each, deepest first. Step 1 = blowout, step 20 = near-tie. */
// Cornyn = gold/yellow shades (matches the gold avatar background #ca8a04).
const CORNYN_RAMP = [
  "#663000", "#713500", "#7C3B00", "#874200", "#924900",
  "#9E5100", "#A95900", "#B46100", "#BF6900", "#C77308",
  "#CC7D16", "#D18724", "#D69230", "#DB9D43", "#E0A857",
  "#E5B36B", "#EABE82", "#F0CA9B", "#F5D7B5", "#FDEADC"
];

// Paxton = red shades (matches the red avatar background #dc2626).
const PAXTON_RAMP = [
  "#6B0000", "#770606", "#830B0B", "#8F1111", "#9B1717",
  "#A71C1C", "#B32222", "#BE2828", "#CA2D2D", "#D63333",
  "#D94343", "#DC5353", "#DF6363", "#E27373", "#E68383",
  "#E99494", "#ECA4A4", "#EFB4B4", "#F2C4C4", "#F5D4D4"
];

// Linear bin: |margin| ∈ [0, 100] → step ∈ [1, 20]. 0 → 20 (lightest), 100 → 1 (deepest).
function rampStep(absMargin) {
  const clamped = Math.max(0, Math.min(100, absMargin));
  return Math.max(1, Math.min(20, Math.round(20 - (clamped / 100) * 19)));
}

// County fill from Cornyn's margin over Paxton in percentage points
// (positive = Cornyn ahead → red ramp; negative = Paxton ahead → orange ramp).
function marginColor(cornynMargin) {
  const step = rampStep(Math.abs(cornynMargin));
  return cornynMargin >= 0 ? CORNYN_RAMP[step - 1] : PAXTON_RAMP[step - 1];
}

/* ──────────── BUCKET DEFINITIONS ────────────
   Demographics card holds three categories (Income, Age, Education) each
   broken into its actual brackets. Geography card lists place-type buckets
   directly. Every bucket gets its own (turnout / electorate / support)
   triple in state, keyed by bucket id. */
const INCOME_BUCKETS = [
  { id: 'income_low',  label: '<$50K' },
  { id: 'income_mid',  label: '$50K–$100K' },
  { id: 'income_high', label: '$100K+' }
];

const EDU_BUCKETS = [
  { id: 'edu_none',     label: 'No college (HS or less)' },
  { id: 'edu_some',     label: 'Some college / AA' },
  { id: 'edu_bachelor', label: "Bachelor's+" }
];

const DEMO_CATEGORIES = [
  { title: 'Income',    buckets: INCOME_BUCKETS },
  { title: 'Education', buckets: EDU_BUCKETS }
];

const GEO_BUCKETS = [
  { id: 'urban',  label: 'Urban' },
  { id: 'suburb', label: 'Suburb' },
  { id: 'exurb',  label: 'Exurb' },
  { id: 'rural',  label: 'Rural' }
];

const ALL_BUCKETS = [
  ...INCOME_BUCKETS, ...EDU_BUCKETS, ...GEO_BUCKETS
];

// Distribute First Round: three first-round candidate groups (Cornyn,
// Paxton, Hunt + third parties), each with Cornyn / Paxton / Did-not-vote
// runoff allocations that auto-normalize to 100. DNV voters drop out of
// the runoff electorate entirely, so increasing DNV shrinks the projected
// turnout.
const FIRST_ROUND_GROUPS = [
  { id: 'cornyn', label: 'Cornyn voters' },
  { id: 'paxton', label: 'Paxton voters' },
  { id: 'hunt',   label: 'Hunt / third parties' }
];

const FIRST_ROUND_DEFAULT = {
  cornyn: { cornyn: 75, paxton: 5,  dnv: 20 },
  paxton: { cornyn: 5,  paxton: 75, dnv: 20 },
  hunt:   { cornyn: 20, paxton: 45, dnv: 35 }
};

const TRUMP_BUCKETS = [{
  id: 'embrace',
  label: 'Embraces Trump → Paxton',
  shareDefault: 46.8,
  shift: 'higher = bigger Paxton boost'
}, {
  id: 'irrelevant',
  label: 'Endorsement irrelevant',
  shareDefault: 33.0,
  shift: 'no directional pull'
}, {
  id: 'reject',
  label: 'Rejects Trump → Cornyn',
  shareDefault: 20.2,
  shift: 'higher = bigger Cornyn boost'
}];

// User-supplied EI bracket Cornyn h2h support defaults (override the crude
// weighted-h2h estimates that computeBracketDefaults produces).
const BRACKET_SUPPORT_DEFAULTS = {
